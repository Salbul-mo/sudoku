{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- i18n:head:start -->
    <!-- Everything inside an i18n region is regenerated per language and per
         page by tools/build_pages.mjs, this comment included. The Korean below
         is the privacy page's, because Django serves this template as-is for
         local development and it has to stand on its own; the build replaces
         all of it for /business/ as well. -->
    <title>개인정보처리방침 | 스도쿠</title>
    <meta name="description" content="계정도 광고도 없는 스도쿠 사이트의 개인정보처리방침. 진행 상황과 기록은 브라우저 안에만 저장됩니다.">
    <link rel="canonical" href="https://sudoku-bw7.pages.dev/privacy/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sudoku-bw7.pages.dev/privacy/">
    <meta property="og:title" content="개인정보처리방침 | 스도쿠">
    <meta property="og:locale" content="ko_KR">
    <!-- i18n:head:end -->

    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="48x48">
    <link rel="icon" href="{% static 'icon.svg' %}" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">

    <meta name="theme-color" content="#E8E7E3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="{% static 'game/css/tokens.css' %}">
    <!-- layout.css for the body rules -- background, colour and the page
         column. Without it these pages have a transparent body, which reads
         as white in dark mode while the footer's tokens stay light. -->
    <link rel="stylesheet" href="{% static 'game/css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'game/css/chrome.css' %}">
    <link rel="stylesheet" href="{% static 'game/css/content.css' %}">
</head>
<body>
    <!-- No #app and no script: this page is text, and the whole point of it is
         that it is readable with JavaScript off. -->
    <!-- i18n:content:start -->
    <main class="content-page">
        <h1>개인정보처리방침</h1>
        <p>이 페이지의 본문은 빌드 시점에 언어별로 생성됩니다.</p>
    </main>
    <!-- i18n:content:end -->

    <!-- i18n:footer:start -->
    <footer class="site-footer">
        <nav aria-label="다른 페이지">
            <a href="/">클래식</a>
        </nav>
    </footer>
    <!-- i18n:footer:end -->
</body>
</html>
