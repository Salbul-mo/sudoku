
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>스도쿠 - 매번 새로 만드는 유일해 퍼즐</title>
    <meta name="description" content="힌트 갯수를 골라 새 퍼즐을 만드는 무료 온라인 스도쿠. 매번 새로 생성되며 정답이 하나뿐인 것이 보장됩니다. 설치 없이 브라우저에서 바로, 키보드와 터치 모두 지원합니다.">

    <!-- The same file is served on both the production alias and every
         preview deployment, so this points search engines at the production
         URL rather than whichever deployment they happened to crawl.
         Change all three URLs together if a custom domain is added. -->
    <link rel="canonical" href="https://sudoku-bw7.pages.dev/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sudoku-bw7.pages.dev/">
    <meta property="og:title" content="스도쿠 - 매번 새로 만드는 유일해 퍼즐">
    <meta property="og:description" content="힌트 갯수를 골라 새 퍼즐을 만드는 무료 온라인 스도쿠. 정답이 하나뿐인 것이 보장됩니다.">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary">

    <meta name="theme-color" content="#E8E7E3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="/game/css/tokens.css">
    <link rel="stylesheet" href="/game/css/layout.css">
    <link rel="stylesheet" href="/game/css/board.css">
    <link rel="stylesheet" href="/game/css/chrome.css">
</head>
<body>
    <!-- Outside #app on purpose: app.js empties that element on boot, so a
         heading placed inside it would be destroyed. Visually hidden because
         the board is the page's visual title, but a document with no h1 at
         all is worse for both crawlers and screen readers. -->
    <h1 class="visually-hidden">스도쿠</h1>

    <main id="app"></main>

    <noscript>
        <p>이 스도쿠는 자바스크립트로 동작합니다. 브라우저에서 자바스크립트를
        켜면 퍼즐이 나타납니다.</p>
    </noscript>

    <script type="module" src="/game/js/main.js"></script>
</body>
